# Local run with one command: docker compose up --build
# App: http://localhost:8080 (with demo data)
name: stockly

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Stockly#Local2026}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=Stockly;User Id=sa;Password=${DB_PASSWORD:-Stockly#Local2026};TrustServerCertificate=True;"
      Seed__DemoContent: ${SEED_DEMO:-true}
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/data-protection-keys

volumes:
  db-data:
  uploads:
  keys:
